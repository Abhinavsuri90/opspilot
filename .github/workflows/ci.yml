name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: opspilot
          POSTGRES_USER: opspilot_owner
          POSTGRES_PASSWORD: owner_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot_owner -d opspilot"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_OWNER_URL: postgresql+psycopg://opspilot_owner:owner_ci_password@localhost:5432/opspilot
      DATABASE_URL: postgresql+psycopg://opspilot_app:app_ci_password@localhost:5432/opspilot
      APP_DB_PASSWORD: app_ci_password
      DEMO_PASSWORD: ci_demo_password
      JWT_SECRET: ci-only-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c infra/api-requirements.lock -e './apps/api[dev]'
      - run: python -m pip check
      - run: python -m pip install 'pip-audit>=2.10,<3'
      - run: python -m pip_audit -r infra/api-requirements.lock --no-deps --strict
      - run: ruff check app tests alembic ../../scripts ../../evals
        working-directory: apps/api
      - run: mypy app tests ../../scripts ../../evals
        working-directory: apps/api
      - run: alembic upgrade head
        working-directory: apps/api
      - run: python scripts/seed.py
      - run: pytest -q
        working-directory: apps/api
      - run: sh scripts/ci_api_smoke.sh
      - run: python -m evals.run --output-dir /tmp/opspilot-eval-reports

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/api.Dockerfile --target runtime -t opspilot-api:ci .
      - run: docker run --rm --entrypoint python opspilot-api:ci -c "import app.main"
      - run: docker run --rm --entrypoint python opspilot-api:ci -m pip check
      - run: test "$(docker run --rm --entrypoint id opspilot-api:ci -u)" = "10001"
      - run: docker build -f infra/web.Dockerfile -t opspilot-web:ci .
      - run: docker run --rm --entrypoint test opspilot-web:ci -f /app/public/sample-invoice.pdf

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cp .env.example .env
      - run: make up
      - run: make smoke-ui
        env:
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:e2e:errors
        working-directory: apps/web
        env:
          WEB_BASE_URL: http://localhost:3300
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=150 api worker web postgres s3mock
      - name: Stop local services
        if: always()
        run: docker compose down --volumes
