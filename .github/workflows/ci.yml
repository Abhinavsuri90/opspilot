name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_eval:
        description: "Run the paid 20-document OpenRouter evaluation"
        type: boolean
        required: false
        default: false

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: opspilot
          POSTGRES_USER: opspilot_owner
          POSTGRES_PASSWORD: owner_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot_owner -d opspilot"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      ENVIRONMENT: development
      DATABASE_OWNER_URL: postgresql+psycopg://opspilot_owner:owner_ci_password@localhost:5432/opspilot
      DATABASE_URL: postgresql+psycopg://opspilot_app:app_ci_password@localhost:5432/opspilot
      APP_DB_PASSWORD: app_ci_password
      DEMO_PASSWORD: ci_demo_password
      JWT_SECRET: ci-only-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c infra/api-requirements.lock -e './apps/api[dev]'
      - run: python -m pip check
      - run: python -m pip install 'pip-audit>=2.10,<3'
      - run: python -m pip_audit -r infra/api-requirements.lock --no-deps --strict
      - run: ruff check app tests alembic ../../scripts ../../evals
        working-directory: apps/api
      - run: mypy app tests ../../scripts ../../evals
        working-directory: apps/api
      - run: alembic upgrade head
        working-directory: apps/api
      - run: python scripts/seed.py
      - run: pytest -q
        working-directory: apps/api
      - run: sh scripts/ci_api_smoke.sh
      - run: python -m evals.run --output-dir /tmp/opspilot-eval-reports
      - name: Check whether a model API key is configured
        id: llm-key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      # Paid evaluation is manual only. A normal push never spends model credits.
      - name: Live model eval (20 documents, tier-1 model)
        if: github.event_name == 'workflow_dispatch' && inputs.live_eval == true && steps.llm-key.outputs.present == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m evals.run --provider openrouter --limit 20 --output-dir /tmp/opspilot-eval-reports

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached base images
        id: base-images
        uses: actions/cache@v4
        with:
          path: /tmp/base-images-release.tar
          key: base-images-release-v1-${{ hashFiles('docker-compose.yml', 'infra/api.Dockerfile', 'infra/web.Dockerfile') }}
      - name: Load cached base images
        if: steps.base-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/base-images-release.tar
      - name: Log in to Docker Hub when credentials are configured
        if: steps.base-images.outputs.cache-hit != 'true' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Pull base images with retry
        if: steps.base-images.outputs.cache-hit != 'true'
        run: |
          set -u
          images="public.ecr.aws/docker/library/python:3.12-slim public.ecr.aws/docker/library/node:22-alpine"
          for image in $images; do
            for attempt in 1 2 3 4 5; do
              if docker pull --quiet "$image"; then break; fi
              if [ "$attempt" = 5 ]; then echo "Could not pull $image after 5 attempts"; exit 1; fi
              echo "Pull of $image failed on attempt $attempt; retrying in 20 seconds"
              sleep 20
            done
          done
          docker save -o /tmp/base-images-release.tar $images
      - run: docker build -f infra/api.Dockerfile --target runtime -t opspilot-api:ci .
      # The runtime image defaults to production settings, which refuse dev secrets; the import check only needs development mode.
      - run: docker run --rm -e ENVIRONMENT=development --entrypoint python opspilot-api:ci -c "import app.main"
      - run: docker run --rm --entrypoint python opspilot-api:ci -m pip check
      - run: test "$(docker run --rm --entrypoint id opspilot-api:ci -u)" = "10001"
      - run: docker build -f infra/web.Dockerfile -t opspilot-web:ci .
      - run: docker run --rm --entrypoint test opspilot-web:ci -f /app/public/sample-invoice.pdf

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cp .env.example .env
      - name: Route Docker Hub pulls through a public mirror
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'
      - name: Restore cached base images
        id: base-images
        uses: actions/cache@v4
        with:
          path: /tmp/base-images-compose.tar
          key: base-images-compose-v1-${{ hashFiles('docker-compose.yml', 'infra/api.Dockerfile', 'infra/web.Dockerfile') }}
      - name: Load cached base images
        if: steps.base-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/base-images-compose.tar
      - name: Log in to Docker Hub when credentials are configured
        if: steps.base-images.outputs.cache-hit != 'true' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Pull base images with retry
        if: steps.base-images.outputs.cache-hit != 'true'
        run: |
          set -u
          images="public.ecr.aws/docker/library/python:3.12-slim public.ecr.aws/docker/library/node:22-alpine pgvector/pgvector:pg16 adobe/s3mock:latest"
          for image in $images; do
            for attempt in 1 2 3 4 5; do
              if docker pull --quiet "$image"; then break; fi
              if [ "$attempt" = 5 ]; then echo "Could not pull $image after 5 attempts"; exit 1; fi
              echo "Pull of $image failed on attempt $attempt; retrying in 20 seconds"
              sleep 20
            done
          done
          docker save -o /tmp/base-images-compose.tar $images
      - name: Start local stack with rules extraction
        run: LLM_PROVIDER=rules OPENROUTER_API_KEY= make up
      - name: Seed fictional organization accounts
        run: make seed
      - name: Seed fictional invoice activity through the API
        run: docker compose run --rm admin python /workspace/scripts/seed_demo_activity.py http://api:8000
      - run: make eval
      - run: make smoke-ui
        env:
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
      - run: node --env-file=../../.env scripts/e2e-learning.mjs
        working-directory: apps/web
        env:
          WEB_BASE_URL: http://localhost:3300
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:e2e:public
        working-directory: apps/web
        env:
          WEB_BASE_URL: http://localhost:3300
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
      - run: make smoke-tenants
        env:
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:e2e:errors
        working-directory: apps/web
        env:
          WEB_BASE_URL: http://localhost:3300
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
      - run: make smoke-workspace
        env:
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:e2e:review
        working-directory: apps/web
        env:
          WEB_BASE_URL: http://localhost:3300
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:e2e:actions
        working-directory: apps/web
        env:
          WEB_BASE_URL: http://localhost:3300
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
          # The script's webhook receiver listens on the runner; containers reach it through the docker0 gateway.
          WEBHOOK_HOST: 172.17.0.1
      - run: npm run test:e2e:intake
        working-directory: apps/web
        env:
          WEB_BASE_URL: http://localhost:3300
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=150 api worker web postgres s3mock
      - name: Stop local services
        if: always()
        run: docker compose down --volumes
