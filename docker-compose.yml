services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  s3mock:
    image: adobe/s3mock:latest
    # The local named volume starts owned by root; the emulator must be able to write it.
    user: "0:0"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: documents
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3mock_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    image: opspilot-api:latest
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://opspilot_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      ENVIRONMENT: ${ENVIRONMENT}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3mock:9090}
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      s3mock:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      retries: 10

  admin:
    image: opspilot-api:latest
    profiles: ["tools"]
    environment:
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL}
      DATABASE_URL: postgresql+psycopg://opspilot_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      ENVIRONMENT: ${ENVIRONMENT}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3mock:9090}
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: opspilot-api:latest
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://opspilot_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      ENVIRONMENT: ${ENVIRONMENT}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3mock:9090}
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.8-flash}
    depends_on:
      postgres:
        condition: service_healthy
      s3mock:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_HOST_PORT:-3300}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  s3mock_data:
