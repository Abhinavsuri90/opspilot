name: opspilot-production

x-service: &service
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

x-api-image: &api-image
  image: opspilot-production-api:local
  build:
    context: ../..
    dockerfile: infra/api.Dockerfile
    target: runtime

x-app-environment: &app-environment
  ENVIRONMENT: production
  COOKIE_SECURE: "true"
  WEB_ORIGIN: https://${OPSPILOT_DOMAIN:?Set OPSPILOT_DOMAIN to the public hostname}
  DATABASE_URL: postgresql+psycopg://opspilot_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/opspilot
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set the OCI S3 compatibility endpoint}
  S3_REGION: ${S3_REGION:?Set S3_REGION}
  S3_BUCKET: ${S3_BUCKET:?Set the private PDF bucket name}
  S3_ADDRESSING_STYLE: path
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set the OCI Customer Secret Key access key}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set the OCI Customer Secret Key secret}
  MAX_DOCUMENTS_PER_ORG: ${MAX_DOCUMENTS_PER_ORG:-1000}

services:
  postgres:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot_owner -d opspilot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    <<: [*service, *api-image]
    profiles: [tools]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      # This one-shot container runs no HTTP server and needs no storage secrets.
      ENVIRONMENT: development
      DATABASE_OWNER_URL: postgresql+psycopg://opspilot_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/opspilot
      DATABASE_URL: postgresql+psycopg://opspilot_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/opspilot
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    networks: [database]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: [*service, *api-image]
    environment:
      <<: *app-environment
      PORT: "8000"
      LLM_PROVIDER: rules
    networks: [application, database]
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 30s

  worker:
    <<: [*service, *api-image]
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-environment
      LLM_PROVIDER: ${LLM_PROVIDER:-rules}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    networks: [application, database]
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 120s
    depends_on:
      api:
        condition: service_healthy

  web:
    <<: *service
    image: opspilot-production-web:local
    build:
      context: ../..
      dockerfile: infra/web.Dockerfile
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      API_INTERNAL_URL: http://api:8000
      PORT: "3000"
    networks: [ingress, application]
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 30s

  caddy:
    <<: *service
    image: caddy:2-alpine
    environment:
      OPSPILOT_DOMAIN: ${OPSPILOT_DOMAIN:?Set OPSPILOT_DOMAIN to the public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [ingress]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    pids_limit: 128
    stop_grace_period: 30s
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  ingress:
  application:
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
